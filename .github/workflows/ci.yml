name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-relevance:
    runs-on: ubuntu-latest
    outputs:
      should_test: ${{ steps.check.outputs.should_test }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if commit warrants tests
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG=$(git log -1 --format='%s')
          if echo "$MSG" | grep -qE '^(feat|fix|refactor|perf|test|build)(\(.+\))?!?:'; then
            echo "should_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_test=false" >> "$GITHUB_OUTPUT"
            echo "Skipping tests: commit '$MSG' is not a code-change type"
          fi

  build-landing:
    needs: check-relevance
    if: needs.check-relevance.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: landing/package-lock.json

      - name: Install and build landing
        working-directory: landing
        run: |
          npm ci
          npm run build

  verify-python:
    needs: check-relevance
    if: needs.check-relevance.outputs.should_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Verify CLI
        run: sitesmyth --help
