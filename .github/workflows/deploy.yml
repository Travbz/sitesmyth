name: Deploy Worker

# Deploys the Cloudflare Worker (infrastructure/) that serves sites from R2.
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts:Edit + Account R2:Edit
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account ID
# The workflow no-ops if the secret is missing, so forks without Cloudflare
# set up will not fail CI.

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: gate
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set — skipping deploy."
          fi

      - name: Deploy with Wrangler
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infrastructure
