<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{business_name}} — Restaurant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-gray-900">
  <header class="bg-amber-800 text-white">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">{{business_name}}</h1>
      <a href="tel:{{phone}}" class="bg-amber-600 px-4 py-2 rounded font-medium">Reserve</a>
    </div>
  </header>
  <main>
    <section class="relative h-72 md:h-96 bg-gray-300">
      <img src="{{hero_image}}" alt="{{business_name}}" class="w-full h-full object-cover">
      <div class="absolute inset-0 flex flex-col justify-end bg-gradient-to-t from-black/70 to-transparent p-8">
        <h2 class="text-3xl md:text-4xl font-bold text-white">{{tagline}}</h2>
        <p class="text-amber-200 mt-2">{{call_to_action}}</p>
      </div>
    </section>
    <section class="max-w-5xl mx-auto px-4 py-12">
      <h3 class="text-2xl font-bold text-amber-800 mb-4">Our Story</h3>
      <p class="text-gray-600 leading-relaxed">{{about}}</p>
    </section>
    <section class="max-w-5xl mx-auto px-4 py-12 bg-white rounded-lg shadow">
      <h3 class="text-2xl font-bold text-amber-800 mb-6">What We Offer</h3>
      <div class="grid md:grid-cols-2 gap-6">
        {{services}}
      </div>
    </section>
    <section class="max-w-5xl mx-auto px-4 py-12">
      <h3 class="text-2xl font-bold text-amber-800 mb-6">Photos</h3>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        {{gallery_images}}
      </div>
    </section>
    <section class="max-w-5xl mx-auto px-4 py-12 bg-amber-800 text-white rounded-lg">
      <h3 class="text-2xl font-bold mb-4">Visit Us</h3>
      <p>{{address}}</p>
      <a href="tel:{{phone}}" class="block text-amber-200 font-medium mt-2 hover:underline">{{phone}}</a>
      {{instagram_link}}
      <div class="mt-4 rounded overflow-hidden">{{google_maps_embed}}</div>
    </section>
  </main>
  <footer class="bg-gray-800 text-gray-300 py-6 text-center text-sm">
    <p>Powered by <a href="https://sitesmyth.com" class="text-amber-400 hover:underline">SiteSmyth</a> — Want this site? Call {{contact_phone}}</p>
  </footer>
</body>
</html>
